<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Henil Modi | Portfolio</title>
        <style>
            * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    }
    
    body {
        font-family: 'Segoe UI', sans-serif;
    background: url('https://images.unsplash.com/photo-1506765515384-028b60a970df?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: #fff;
    }
    
    .container {
        background: rgba(52, 50, 50, 0.34);
        backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 40px 30px;
    max-width: 600px;
    width: 90%;
    text-align: center;
    animation: slideFade 1.5s ease-in-out;
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
    }

    h1 {
        font-size: 2.8rem;
    color: #80d8ff;
    margin-bottom: 10px;
    animation: popIn 1s ease-in-out;
    }
    
    .subtitle {
      font-size: 1.2rem;
      color: #e0f7fa;
      margin-bottom: 25px;
      animation: popIn 1.4s ease-in-out;
    }

    .intro {
      font-size: 1rem;
      margin-bottom: 35px;
      line-height: 1.6;
      animation: popIn 1.7s ease-in-out;
    }
    
    .resume-btn {
        display: inline-block;
      padding: 12px 30px;
      background: linear-gradient(135deg, #00bcd4, #2196f3);
      color: white;
      text-decoration: none;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      position: relative;
      overflow: hidden;
      z-index: 1;
      transition: transform 0.3s;
      animation: glow 2s infinite alternate;
    }
    
    .resume-btn:hover {
        transform: scale(1.05);
    }

    @keyframes slideFade {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes popIn {
        0% {
            opacity: 0;
        transform: scale(0.8);
      }
      100% {
          opacity: 1;
        transform: scale(1);
      }
    }
    
    @keyframes glow {
        from {
        box-shadow: 0 0 10px #00bcd4, 0 0 20px #2196f3;
      }
      to {
          box-shadow: 0 0 20px #2196f3, 0 0 30px #00bcd4;
        }
    }
    
    @media (max-width: 600px) {
        h1 {
            font-size: 2rem;
        }
        
        .intro {
            font-size: 0.9rem;
      }
      
      .resume-btn {
          padding: 10px 20px;
          font-size: 0.95rem;
        }
    }
  </style>
</head>
<body>
    <div class="container">
    <h1>Henil Modi</h1>
    <p class="subtitle">Creative Web Developer & Designer</p>
    <p class="intro">
        Hi! I'm Henil, passionate about creating modern, beautiful, and functional web designs.
      I blend creativity with code to build engaging user experiences. ✨
    </p>
    <a href="resume.html" target="_blank" class="resume-btn">View Resume</a>
</div>
</body>
</html>
