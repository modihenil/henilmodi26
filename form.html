<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>SVMIT Bharuch Registration</title>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
        <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: url('https://www.transparenttextures.com/patterns/diamond-upholstery.png'), linear-gradient(135deg, #1f2b37, #374b63);
      background-blend-mode: overlay;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      padding: 20px;
    }

    .form-wrapper {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 600px;
      animation: fadeInScale 1s ease-out;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    @keyframes fadeInScale {
        0% {
        opacity: 0;
        transform: scale(0.9);
    }
    100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    h2 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 30px;
      font-weight: 600;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
      animation: fadeInText 1.5s ease-in;
    }

    @keyframes fadeInText {
      from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-group {
      position: relative;
      margin-bottom: 25px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 14px 12px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.9);
      outline: none;
      font-size: 15px;
      transition: all 0.3s ease;
    }
    
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        box-shadow: 0 0 12px rgba(0, 255, 255, 0.5);
    }
    
    .form-group label {
        position: absolute;
        left: 15px;
        top: 14px;
      background: transparent;
      padding: 0 5px;
      color: #444;
      pointer-events: none;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .form-group input:focus + label,
    .form-group input:not(:placeholder-shown) + label,
    .form-group select:focus + label,
    .form-group select:valid + label,
    .form-group textarea:focus + label,
    .form-group textarea:not(:placeholder-shown) + label {
      top: -10px;
      left: 10px;
      font-size: 12px;
      background: #fff;
      color: #2980b9;
    }
    
    .radio-group {
        display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      color: white;
    }
    
    .radio-group label {
      font-size: 15px;
      margin-right: 15px;
    }
    
    .btn {
        width: 100%;
        padding: 14px;
      background: linear-gradient(135deg, #2980b9, #6dd5fa);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
      animation: pulse 2s infinite;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 15px rgba(41, 128, 185, 0.4);
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.03); }
        100% { transform: scale(1); }
    }
    
    .footer-text {
        text-align: center;
        margin-top: 20px;
        color: #ccc;
        font-size: 13px;
    }
    
    @media (max-width: 600px) {
      .form-wrapper {
        padding: 30px 20px;
    }
      .radio-group {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="form-wrapper">
    <h2>SVMIT Bharuch<br>College Registration Form</h2>
    <form>
        <div class="form-group">
            <input type="text" id="fullname" name="fullname" required placeholder=" " />
            <label for="fullname">Full Name</label>
        </div>

      <div class="form-group">
        <input type="email"
           id="email"
           name="email"
           required
           pattern="[a-zA-Z0-9._%+-]+@(gmail\.com|yahoo\.com|icloud\.com|outlook\.com)"
           title="Only Gmail, Yahoo, iCloud, or Outlook emails allowed"
           placeholder=" " />        <label for="email">Email Address</label>
        </div>
        
        <div class="form-group">
            <input type="tel" id="phone" name="phone" required pattern="[0-9]{10}" placeholder=" " />
        <label for="phone">Mobile Number</label>
    </div>
    
      <div class="form-group">
        <input type="date" id="dob" name="dob" required />
        <label for="dob">Date of Birth</label>
    </div>

      <div class="form-group">
        <textarea id="address" name="address" rows="3" required placeholder=" "></textarea>
        <label for="address">Address</label>
      </div>
      
      <div class="radio-group">
          <label><input type="radio" name="gender" value="Male" required /> Male</label>
          <label><input type="radio" name="gender" value="Female" required /> Female</label>
        <label><input type="radio" name="gender" value="Other" required /> Other</label>
      </div>

      <div class="form-group">
          <select id="department" name="department" required>
              <option value="" disabled selected hidden></option>
          <option value="CE">Computer Engineering</option>
          <option value="IT">Information Technology</option>
          <option value="ME">Mechanical Engineering</option>
          <option value="CH">Chemical Engineering</option>
          <option value="EC">Electronics & Communication</option>
        </select>
        <label for="department">Select Department</label>
    </div>
    
    <div class="form-group">
        <select id="year" name="year" required>
          <option value="" disabled selected hidden></option>
          <option value="1">1st Year</option>
          <option value="2">2nd Year</option>
          <option value="3">3rd Year</option>
          <option value="4">4th Year</option>
        </select>
        <label for="year">Academic Year</label>
    </div>
    
    <div class="form-group">
        <input type="file" id="photo" name="photo" accept="image/*" required />
        <label for="photo">Upload Photo</label>
    </div>
    
    <button type="submit" class="btn">Register Now</button>
</form>

    <div class="footer-text">
        &copy; 2025 SVMIT, Bharuch. All Rights Reserved.
    </div>
</div>
</body>
</html>
